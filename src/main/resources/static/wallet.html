<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Wallet</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: sans-serif; background: #f4f4f4; padding: 2rem; color: #222; }

    h1 { margin-bottom: 1.5rem; color: #2e7d32; }

    .total {
      background: #2e7d32; color: white;
      padding: 1rem 1.5rem; border-radius: 8px;
      font-size: 1.3rem; font-weight: bold;
      margin-bottom: 2rem; display: inline-block;
    }

    .card {
      background: white; border-radius: 8px;
      padding: 1.5rem; margin-bottom: 1.5rem;
      box-shadow: 0 1px 4px rgba(0,0,0,.1); max-width: 600px;
    }
    .card h2 { margin-bottom: 1rem; font-size: 1rem; color: #555; }

    .form-row { display: flex; gap: .6rem; flex-wrap: wrap; }
    input, select {
      padding: .5rem .7rem; border: 1px solid #ccc;
      border-radius: 5px; font-size: .95rem; flex: 1; min-width: 100px;
    }
    input:focus, select:focus { outline: none; border-color: #2e7d32; }
    button {
      background: #2e7d32; color: white; border: none;
      padding: .5rem 1.2rem; border-radius: 5px;
      cursor: pointer; font-size: .95rem;
    }
    button:hover { background: #1b5e20; }

    table { width: 100%; border-collapse: collapse; max-width: 600px; }
    th, td { padding: .65rem 1rem; text-align: left; border-bottom: 1px solid #eee; font-size: .92rem; }
    th { color: #888; font-size: .8rem; text-transform: uppercase; }
    .amount { color: #2e7d32; font-weight: bold; }
    .empty { text-align: center; color: #aaa; padding: 1.5rem; }

    .overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,.4); z-index: 100;
      align-items: center; justify-content: center;
    }
    .overlay.open { display: flex; }
    .modal {
      background: white; border-radius: 8px;
      padding: 1.5rem; width: 340px; max-width: 95vw;
    }
    .modal h3 { margin-bottom: 1rem; font-size: 1rem; color: #555; }
    .modal-row { display: flex; gap: .6rem; }
    .btn-cancel { background: #888; }
    .btn-cancel:hover { background: #666; }
  </style>
</head>
<body>

<h1>💰 Wallet</h1>

<div class="total">Total Spent: $<span id="total">0.00</span></div>

<!-- Add Expense -->
<div class="card">
  <h2>Add Expense</h2>
  <div class="form-row">
    <input id="expTitle" placeholder="Title"/>
    <input id="expAmount" type="number" step="0.01" placeholder="Amount"/>
    <select id="expCategory"><option value="" data-name="">Category</option></select>
    <button onclick="createExpense()">Add</button>
  </div>
</div>

<!-- New Category Modal -->
<div class="overlay" id="newCatModal">
  <div class="modal">
    <h3>New Category</h3>
    <div class="modal-row">
      <input id="inlineCatName" placeholder="Category name" style="flex:1"/>
      <button onclick="createCategoryInline()">Add</button>
      <button class="btn-cancel" onclick="closeNewCatModal()">Cancel</button>
    </div>
  </div>
</div>

<!-- All Expenses -->
<table>
  <thead><tr><th>Title</th><th>Amount</th><th>Category</th></tr></thead>
  <tbody id="expTable"></tbody>
</table>

<script>
  const BASE = 'http://localhost:8080';
  let expenses = [], categories = [];

  async function init() {
    try { categories = await (await fetch(`${BASE}/category`)).json(); } catch { categories = []; }
    try { expenses = await (await fetch(`${BASE}/expense`)).json(); } catch { expenses = []; }
    renderCategorySelect();
    renderExpenses();
  }

  function renderCategorySelect() {
    document.getElementById('expCategory').innerHTML =
      '<option value="">Category</option>' +
      categories.map(c => `<option value="${c.name}">${c.name}</option>`).join('') +
      '<option value="__new__">➕ Add new category</option>';
  }

  document.getElementById('expCategory').addEventListener('change', function() {
    if (this.value === '__new__') {
      this.value = '';
      document.getElementById('newCatModal').classList.add('open');
      document.getElementById('inlineCatName').focus();
    }
  });

  function closeNewCatModal() {
    document.getElementById('newCatModal').classList.remove('open');
    document.getElementById('inlineCatName').value = '';
  }

  async function createCategoryInline() {
    const name = document.getElementById('inlineCatName').value.trim();
    if (!name) return alert('Enter a category name.');
    try {
      const r = await fetch(`${BASE}/category`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, defaultCategory: false })
      });
      if (!r.ok) throw new Error();
      categories = await (await fetch(`${BASE}/category`)).json();
      renderCategorySelect();
      // auto-select the newly created category
      const newCat = categories.find(c => c.name === name);
      if (newCat) document.getElementById('expCategory').value = newCat.name;
      closeNewCatModal();
    } catch { alert('Failed to add category.'); }
  }

  async function fetchTotal() {
    try {
      const r = await fetch(`${BASE}/expense/total`);
      const total = await r.json();
      document.getElementById('total').textContent = parseFloat(total).toFixed(2);
    } catch {
      document.getElementById('total').textContent = '—';
    }
  }

  function renderExpenses() {
    fetchTotal();
    document.getElementById('expTable').innerHTML = expenses.length
      ? expenses.map(e => `<tr>
          <td>${e.title}</td>
          <td class="amount">$${parseFloat(e.amount).toFixed(2)}</td>
          <td>${e.category?.name || '—'}</td>
        </tr>`).join('')
      : `<tr><td class="empty" colspan="3">No expenses yet.</td></tr>`;
  }

  async function createExpense() {
    const title = document.getElementById('expTitle').value.trim();
    const amount = document.getElementById('expAmount').value;
    const categoryName = document.getElementById('expCategory').value;
    if (!title || !amount || !categoryName) return alert('Please fill in all fields.');
    try {
      const r = await fetch(`${BASE}/expense`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title, amount: parseFloat(amount), categoryName })
      });
      if (!r.ok) throw new Error();
      expenses = await (await fetch(`${BASE}/expense`)).json();
      document.getElementById('expTitle').value = '';
      document.getElementById('expAmount').value = '';
      document.getElementById('expCategory').value = '';
      renderExpenses();
    } catch { alert('Failed to add expense.'); }
  }

  init();
</script>
</body>
</html>
